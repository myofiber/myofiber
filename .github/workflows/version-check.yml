name: Version Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-check:
    name: Check Version Increment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check React package version
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/react/package.json').version")

          MAIN_VERSION=$(git show origin/main:packages/react/package.json | node -e "
            let data = '';
            process.stdin.on('data', chunk => data += chunk);
            process.stdin.on('end', () => {
              console.log(JSON.parse(data).version);
            });
          ")

          echo "Main version:    $MAIN_VERSION"
          echo "PR version:      $CURRENT_VERSION"

          node - "$MAIN_VERSION" "$CURRENT_VERSION" <<'NODE'
          const mainVersion = process.argv[2];
          const currentVersion = process.argv[3];

          function parseVersion(version) {
            const match = version.match(
              /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/
            );

            if (!match) {
              throw new Error(`Invalid SemVer version: ${version}`);
            }

            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              prerelease: match[4]
                ? match[4].split(".")
                : null,
            };
          }

          function compare(a, b) {
            if (a.major !== b.major) {
              return a.major - b.major;
            }

            if (a.minor !== b.minor) {
              return a.minor - b.minor;
            }

            if (a.patch !== b.patch) {
              return a.patch - b.patch;
            }

            // A normal release is greater than a prerelease.
            if (!a.prerelease && !b.prerelease) {
              return 0;
            }

            if (!a.prerelease) {
              return 1;
            }

            if (!b.prerelease) {
              return -1;
            }

            const length = Math.max(
              a.prerelease.length,
              b.prerelease.length
            );

            for (let i = 0; i < length; i++) {
              const left = a.prerelease[i];
              const right = b.prerelease[i];

              if (left === undefined) return -1;
              if (right === undefined) return 1;

              const leftNumeric = /^\d+$/.test(left);
              const rightNumeric = /^\d+$/.test(right);

              if (leftNumeric && rightNumeric) {
                const difference =
                  Number(left) - Number(right);

                if (difference !== 0) {
                  return difference;
                }

                continue;
              }

              if (leftNumeric && !rightNumeric) {
                return -1;
              }

              if (!leftNumeric && rightNumeric) {
                return 1;
              }

              if (left !== right) {
                return left < right ? -1 : 1;
              }
            }

            return 0;
          }

          const main = parseVersion(mainVersion);
          const current = parseVersion(currentVersion);

          const result = compare(current, main);

          if (result <= 0) {
            console.error("");
            console.error("❌ Version was not incremented.");
            console.error(`   main: ${mainVersion}`);
            console.error(`   PR:   ${currentVersion}`);
            console.error("");
            process.exit(1);
          }

          console.log("");
          console.log("✅ Version increment is valid.");
          console.log(`   main: ${mainVersion}`);
          console.log(`   PR:   ${currentVersion}`);
          console.log("");
          NODE